<!DOCTYPE html>
<html>
<head>
    <title>AI Lab | Space Invaders</title>
    <style>
        body { background: #000; color: #00ff88; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { border: 2px solid #00ff88; background: #000; box-shadow: 0 0 20px #00ff88; }
        .ui { margin-top: 10px; text-align: center; }
        kbd { background: #333; padding: 2px 6px; border-radius: 4px; color: #fff; }
    </style>
</head>
<body>
    <h1>AI TOOLBOX DEFENDER</h1>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="ui">
        <p>Score: <span id="score">0</span> | Use <kbd>A</kbd> <kbd>D</kbd> to Move & <kbd>SPACE</kbd> to Shoot</p>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let gameActive = true;

    // Player Object
    const player = { x: canvas.width / 2 - 15, y: canvas.height - 30, w: 30, h: 20, speed: 5 };
    const bullets = [];
    const invaders = [];

    // Keys state
    const keys = { a: false, d: false, space: false };

    // Create Invaders
    for(let r=0; r<3; r++) {
        for(let c=0; c<10; c++) {
            invaders.push({ x: c * 50 + 50, y: r * 40 + 50, w: 30, h: 20, alive: true });
        }
    }

    window.addEventListener('keydown', e => { 
        if(e.code === 'KeyA') keys.a = true;
        if(e.code === 'KeyD') keys.d = true;
        if(e.code === 'Space') {
            bullets.push({ x: player.x + player.w/2, y: player.y, speed: 7 });
            e.preventDefault(); // Stop page from jumping
        }
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'KeyA') keys.a = false;
        if(e.code === 'KeyD') keys.d = false;
    });

    function update() {
        if(!gameActive) return;

        if(keys.a && player.x > 0) player.x -= player.speed;
        if(keys.d && player.x < canvas.width - player.w) player.x += player.speed;

        bullets.forEach((b, i) => {
            b.y -= b.speed;
            if(b.y < 0) bullets.splice(i, 1);
        });

        invaders.forEach(inv => {
            if(!inv.alive) return;
            bullets.forEach((b, bi) => {
                if(b.x > inv.x && b.x < inv.x + inv.w && b.y > inv.y && b.y < inv.y + inv.h) {
                    inv.alive = false;
                    bullets.splice(bi, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            });
        });

        if(invaders.every(i => !i.alive)) {
            alert("Victory! AI Tools Secured.");
            location.reload();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player (The "User")
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Draw Bullets
        ctx.fillStyle = '#fff';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, 2, 10));

        // Draw Invaders (The "Bugs")
        ctx.fillStyle = '#ff0055';
        invaders.forEach(inv => {
            if(inv.alive) ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
        });

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
