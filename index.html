<head>

    <title>AI Toolbox | Nakphanan</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; border: 1px solid #333; padding: 2rem; border-radius: 12px; background: #1e1e1e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .btn:hover { background: #00cc6e; transform: translateY(-2px); }
    </style>
</head>

    <div class="container">
        <h1>AI Toolbox</h1>
        <p>Command center for AI experiments and tools.</p>
